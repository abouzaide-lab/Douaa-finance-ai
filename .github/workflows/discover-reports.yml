name: Noura - Discover Financial Reports

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Discover reports
        run: python data/discover_reports.py

      - name: Save discovered reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovered_reports.json
                    if ! git diff --cached --quiet; then
            git commit -m "Update discovered financial reports"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
