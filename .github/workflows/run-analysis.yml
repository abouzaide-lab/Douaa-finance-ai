
name: Run SAIDAL Financial Analysis

on:
  push:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile data/analyze.py

      - name: Run financial analysis
        run: python data/analyze.py
